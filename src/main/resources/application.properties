# This is the Spring Boot configuration file.
# Think of it as a settings panel for your application.

# The port your server runs on. Default is 8080.
# Open http://localhost:8080 in your browser to see your website!
server.port=8080

# Your app name (shows in logs)
spring.application.name=SreeRamHotel

# This tells Spring Boot to look for index.html in static/ folder as the default page
spring.web.resources.static-locations=classpath:/static/
